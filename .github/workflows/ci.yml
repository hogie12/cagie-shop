name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: "**/go.sum"
      # Same Postgres and RabbitMQ as on a laptop, with throwaway random passwords.
      - name: Start Postgres and RabbitMQ
        run: |
          ./scripts/ci-env.sh
          docker compose up -d --wait postgres rabbitmq
          make test-setup
      - name: Run all Go tests
        run: ./scripts/ci-test-go.sh

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Typecheck
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit
      - run: pnpm test
      # No backend here: the shop page builds with its "taking a short break" fallback.
      - run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Start the whole stack
        run: |
          ./scripts/ci-env.sh
          ./scripts/gen-keys.sh
          make build
          docker compose up -d --wait
          for i in $(seq 1 30); do curl -sf localhost:8080/products >/dev/null && exit 0; sleep 2; done
          echo "gateway did not come up"; docker compose logs; exit 1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Run Playwright
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          cp .env.example .env.local
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - name: Save logs and reports on failure
        if: failure()
        run: docker compose logs > compose-logs.txt
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-failure
          path: |
            apps/web/test-results
            compose-logs.txt
          retention-days: 7

  images:
    name: Images (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [catalog, auth, gateway, inventory, order, payment]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/cagie-shop-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      # The VPS is x86_64. Add linux/arm64 here if an ARM server is ever used:
      # the Dockerfiles cross-compile, so that needs no CPU emulation.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
